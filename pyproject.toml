[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprforge"
version = "0.1.0"
description = "Budgeted heterogeneous representations for multimodal document retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
gpu = [
    "colpali-engine",
    "pillow",
    "pyarrow",
    "torch>=2.5",
    "transformers",
]
vidore = [
    "colpali-engine==0.3.12",
    "pytrec-eval-terrier==0.5.10",
    "transformers==4.53.2",
    "vidore-benchmark @ git+https://github.com/illuin-tech/vidore-benchmark.git@a70f23af8bb3b33efe8a4a6c6c15a6e2d978035e",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["reprforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
