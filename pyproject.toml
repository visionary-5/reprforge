[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprforge"
version = "0.1.0"
description = "Budgeted heterogeneous representations for multimodal document retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
gpu = [
    "colpali-engine",
    "pillow",
    "pyarrow",
    "torch>=2.5",
    "transformers",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["reprforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
